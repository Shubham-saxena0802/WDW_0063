<!DOCTYPE html>
<html lang="en">
<head>
    <title>ABC College Admission 2026</title>
</head>
<body>
    <header style="background-color: #202878; color: white; text-align: center; padding: 20px;">
        <h1>ABC College Admission 2026</h1>
    </header>

    <main style="width: 70%; margin: auto;">
        <h2>Courses and Fees</h2>

        <table border="1" cellpadding="5" cellspacing="0" width="100%">
            <caption>Available Courses</caption>

            <tr style="background-color: #e8eaf6;">
                <th>Course</th>
                <th>Seats</th>
                <th>Fees</th>
            </tr>

            <tr>
                <td>B.Tech CSE</td>
                <td>120</td>
                <td>₹90,000</td>
            </tr>

            <tr>
                <td>BCA</td>
                <td>60</td>
                <td>₹45,000</td>
            </tr>
        </table>

        <br>

        <form>
            <fieldset>
                <legend>Application Form</legend>

                <label for="name">Name:</label>
                <br>
                <input type="text" id="name" name="name" required>
                <br><br>

                <label for="email">Email:</label>
                <br>
                <input type="email" id="email" name="email" required>
                <br><br>

                <label for="course">Course:</label>
                <br>
                <select id="course" name="course">
                    <option>B.Tech CSE</option>
                    <option>BCA</option>
                </select>
                <br><br>

                <label for="statement">Statement:</label>
                <br>
                <textarea id="statement" name="statement" rows="3" cols="40"></textarea>
                <br><br>

                <input type="submit" value="Apply">
            </fieldset>
        </form>
    </main>

    <footer style="background-color: #202878; color: white; text-align: center; padding: 8px;">
        &copy; 2026 ABC College
    </footer>
</body>
</html>
