<!DOCTYPE html>
<html>
<head>
    <title>Block and Inline Elements</title>
</head>
<body>

    <table width="100%" cellpadding="2" cellspacing="2">
        <tr>
            <td bgcolor="lightblue">Block 1</td>
        </tr>

        <tr>
            <td bgcolor="lightblue">Block 2</td>
        </tr>
    </table>

    <table cellpadding="2" cellspacing="2">
        <tr>
            <td bgcolor="lightgreen">Inline 1</td>
            <td bgcolor="lightgreen">Inline 2</td>
            <td bgcolor="lightgreen">Inline 3</td>
        </tr>
    </table>

</body>
</html>
