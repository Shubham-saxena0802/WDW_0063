<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hotel Room Booking Form</title>
</head>

<body>

    <h1 align="center">Hotel Room Booking Form</h1>

    <form action="#" method="post">

        <fieldset>

            <legend><strong>Booking Details</strong></legend>

            <label for="fullname">Full Name:</label>
            <br>

            <input type="text" id="fullname" name="fullname"
                   placeholder="Enter your full name" required>

            <br><br>

            <label for="email">Email:</label>
            <br>

            <input type="email" id="email" name="email"
                   placeholder="Enter your email address" required>

            <br><br>

            <label for="phone">Phone Number:</label>
            <br>

            <input type="tel" id="phone" name="phone"
                   placeholder="Enter your phone number" required>

            <br><br>

            <label for="checkin">Check-in Date:</label>
            <br>

            <input type="date" id="checkin" name="checkin" required>

            <br><br>

            <label for="checkout">Check-out Date:</label>
            <br>

            <input type="date" id="checkout" name="checkout" required>

            <br><br>

            <label for="room">Room Type:</label>
            <br>

            <select id="room" name="room" required>

                <option value="">-- Select Room Type --</option>
                <option value="single">Single Room</option>
                <option value="double">Double Room</option>
                <option value="deluxe">Deluxe Room</option>
                <option value="suite">Suite</option>

            </select>

            <br><br>

            <label for="guests">Number of Guests:</label>
            <br>

            <input type="number" id="guests" name="guests"
                   min="1" max="10" value="1" required>

            <br><br>

            <label for="requests">Special Requests:</label>
            <br>

            <textarea id="requests" name="requests" rows="4" cols="40"
                      placeholder="Enter any special requests (optional)"></textarea>

            <br><br>

            <input type="submit" value="Book Now">

            <input type="reset" value="Reset Form">

        </fieldset>

    </form>

</body>
</html>
