<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration Form</title>
</head>

<body>

    <h1 align="center">Student Registration Form</h1>

    <hr>

    <form action="submit.html" method="post">

        <fieldset>

            <legend><strong>Student Details</strong></legend>

            <label for="name">Full Name:</label>
            <br>

            <input type="text" id="name" name="name"
                   placeholder="Enter your full name" required>

            <br><br>

            <label for="email">Email:</label>
            <br>

            <input type="email" id="email" name="email"
                   placeholder="Enter valid email address" required>

            <br><br>

            <label for="password">Password:</label>
            <br>

            <input type="password" id="password" name="password"
                   placeholder="Enter password" required>

            <br><br>

            <label>Gender:</label>
            <br>

            <input type="radio" id="male" name="gender"
                   value="Male" required>
            <label for="male">Male</label>

            <input type="radio" id="female" name="gender"
                   value="Female">
            <label for="female">Female</label>

            <input type="radio" id="other" name="gender"
                   value="Other">
            <label for="other">Other</label>

            <br><br>

            <label for="course">Course:</label>
            <br>

            <select id="course" name="course" required>

                <option value="">-- Select Course --</option>
                <option value="CSE">CSE</option>
                <option value="ELCE">ELCE</option>
                <option value="ECE">ECE</option>
                <option value="IT">IT</option>
                <option value="Mechanical">Mechanical</option>

            </select>

            <br><br>

            <label for="contact">Contact No:</label>
            <br>

            <input type="tel" id="contact" name="contact"
                   placeholder="Enter phone number" required>

            <br><br>

            <label for="address">Address:</label>
            <br>

            <textarea id="address" name="address" rows="4" cols="40"
                      placeholder="Enter your address" required></textarea>

            <br><br>

            <input type="submit" value="Register">

            <input type="reset" value="Clear">

        </fieldset>

    </form>

    <hr>

    <footer>

        <p align="center">
            &copy; 2025 Student Registration Portal
        </p>

    </footer>

</body>
</html>
